<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARK OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#1C2620; --muted:#5B6960; --line:#D6DDD3;
  --canopy:#21402D; --canopy-2:#2B5039; --canopy-ink:#E7EEE6; --canopy-muted:#A9BCAE;
  --leaf:#3E7A55; --sea:#1F6E7A; --sun:#C99A1E; --clay:#A65A3A; --plum:#6E4A7E; --slate:#56636B;
  --danger:#B4442F; --focus:#1F6E7A;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111713; --surface:#18201B; --surface-2:#212B24; --ink:#E5ECE4; --muted:#9BA99F; --line:#2D3931;
    --canopy:#0C140F; --canopy-2:#18261D; --canopy-ink:#E5ECE4; --canopy-muted:#8FA596;
    --leaf:#6BB386; --sea:#5DB2BD; --sun:#E3B341; --clay:#D98A68; --plum:#B593C4; --slate:#97A6AE;
    --danger:#E27D66; --focus:#5DB2BD;
  }
}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201B; --surface-2:#212B24; --ink:#E5ECE4; --muted:#9BA99F; --line:#2D3931;
  --canopy:#0C140F; --canopy-2:#18261D; --canopy-ink:#E5ECE4; --canopy-muted:#8FA596;
  --leaf:#6BB386; --sea:#5DB2BD; --sun:#E3B341; --clay:#D98A68; --plum:#B593C4; --slate:#97A6AE;
  --danger:#E27D66; --focus:#5DB2BD;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--canopy);color:var(--canopy-ink);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.mark{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-0.02em;padding:0 10px 2px;line-height:1}
.mark small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--canopy-muted);letter-spacing:0;margin-left:6px}
.place{padding:4px 10px 22px;color:var(--canopy-muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--canopy-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--canopy-2)}
.nav a[aria-current="page"]{background:var(--canopy-2);box-shadow:inset 3px 0 0 var(--sun)}
.nav a .later{margin-left:auto;font-size:11px;color:var(--canopy-muted);font-weight:500}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav .gap{height:14px}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:12.5px;color:var(--canopy-muted);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--canopy-muted)}
.dot.shared{background:#6BB386}.dot.local{background:var(--sun)}

.topbar{display:none}
main{overflow-y:auto;height:100%}
.page{max-width:1080px;margin:0 auto;padding:36px 40px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-0.025em;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-0.01em;margin:0 0 4px}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--leaf)}

.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:9px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0C140F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0C140F}}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.field-in{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}
.toolbar .search{flex:1 1 220px}
.count{color:var(--muted);font-size:13.5px;margin-left:auto}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(220px,2.2fr) 1.3fr 1.1fr 1fr 80px;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.head{cursor:default;font-size:12.5px;color:var(--muted);font-weight:600;padding-top:10px;padding-bottom:10px;background:var(--surface-2)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;font-size:14px;color:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip i{width:9px;height:9px;border-radius:3px;flex:none}
.muted{color:var(--muted)}
.status{font-size:13px;font-weight:600}
.status.on{color:var(--leaf)}.status.off{color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 28px;text-align:center}
.empty p{color:var(--muted);margin:6px auto 18px;max-width:46ch}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;text-align:left;cursor:pointer;width:100%}
.card:hover{border-color:var(--muted)}
.card .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card .swatch{width:14px;height:14px;border-radius:4px}
.card h3{font-family:var(--display);font-size:18px;font-weight:700;margin:0;letter-spacing:-0.01em}
.card p{color:var(--muted);margin:0 0 12px;font-size:14px}
.card .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

.roles{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.role{display:grid;grid-template-columns:200px 1fr 90px;gap:16px;padding:15px 18px;border-top:1px solid var(--line);align-items:baseline}
.role:first-child{border-top:0}
.role b{font-weight:600}
.role .n{text-align:right;color:var(--muted);font-size:13.5px}
.note{color:var(--muted);font-size:14px;margin:14px 2px 0;max-width:70ch}

.form-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:640px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label{font-size:13.5px;font-weight:600}
.fld .hint{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
.fld textarea{min-height:92px;resize:vertical}
.fld .err{color:var(--danger);font-size:13px;display:none}
.fld.invalid input{border-color:var(--danger)}.fld.invalid .err{display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.swatches input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.swatches input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}

/* dashboard */
.hello{background:var(--canopy);color:var(--canopy-ink);border-radius:18px;padding:30px 30px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.hello h1{color:var(--canopy-ink);font-size:46px}
.hello p{color:var(--canopy-muted);margin:10px 0 0;max-width:56ch}
.hello svg{position:absolute;right:-30px;bottom:-40px;width:300px;height:300px;opacity:.16;fill:none;stroke:var(--canopy-ink);stroke-width:1}
.steps{display:grid;gap:10px;margin-bottom:28px}
.step{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:1.5px solid var(--line);flex:none}
.step.done .num{background:var(--leaf);border-color:var(--leaf);color:#fff}
.step .txt{flex:1;min-width:0}
.step .txt b{display:block;font-weight:600}
.step .txt span{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
.stat span{color:var(--muted);font-size:13.5px}
.section-title{margin:0 0 12px}

/* planned modules */
.planned{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px;max-width:680px}
.planned .tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--sun);border:1px solid currentColor;border-radius:999px;padding:3px 10px;margin-bottom:14px}
.planned p{color:var(--muted);margin:8px 0 22px;font-size:16px;max-width:54ch}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,13,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.drawer .body{padding:20px 24px;overflow-y:auto;flex:1}
.drawer footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);align-items:center}
.drawer footer .spacer{flex:1}
.x{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width: 860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--canopy);color:var(--canopy-ink);padding:12px 16px}
  .topbar .mark{padding:0;font-size:22px}
  .topbar button{background:none;border:1px solid var(--canopy-2);color:var(--canopy-ink);border-radius:9px;padding:7px 12px;font-weight:600}
  .side{position:fixed;inset:0 30% 0 0;z-index:20;transform:translateX(-105%);transition:transform .22s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .page{padding:24px 18px 64px}
  h1{font-size:32px}.hello h1{font-size:34px}
  .row{grid-template-columns:1fr auto;gap:8px}
  .row .c-div,.row .c-role,.row .c-type{display:none}
  .row.head{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .role{grid-template-columns:1fr auto}.role .d{grid-column:1/-1;order:3}
  .grid2{grid-template-columns:1fr}
}
/* ---- events & classes ---- */
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.weeknav .range{font-family:var(--display);font-weight:700;font-size:18px;margin-right:auto}
.weeknav .btn{padding:7px 12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:200px;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.day header{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px}
.day header b{font-weight:600;font-size:13.5px}
.day header span{font-family:var(--display);font-weight:700;font-size:20px}
.day.today{border-color:var(--leaf);box-shadow:inset 0 3px 0 var(--leaf)}
.day.today header{color:var(--leaf)}
.day .none{color:var(--muted);font-size:12.5px;padding:0 4px}
.sess{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--leaf);background:var(--surface-2);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:13px;line-height:1.35}
.sess.event{border-left-color:var(--sun)}
.sess:hover{filter:brightness(.97)}
.sess .tm{color:var(--muted);font-size:12px;display:block}
.sess b{font-weight:600;display:block;overflow-wrap:anywhere}
.sess .by{color:var(--muted);font-size:12px;display:block}
.sess .cap{font-size:12px;color:var(--muted)}
.sess.draft{background:transparent;outline:1px dashed var(--line)}
.sess.cancelled b{text-decoration:line-through}
.sess.cancelled{opacity:.6}
.legend{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.orow{grid-template-columns:minmax(200px,2fr) 1.8fr 1.2fr 90px}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.kind i{width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.kind.event i{background:var(--sun)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;inset:0;cursor:pointer}
.daypick span{display:block;padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:13.5px;background:var(--bg)}
.daypick input:checked + span{background:var(--leaf);border-color:var(--leaf);color:#fff}
.daypick input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.subhead{font-family:var(--display);font-weight:700;font-size:16px;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
.subhint{color:var(--muted);font-size:13px;margin:0 0 12px}
.trow{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1.5fr .9fr .8fr .8fr;gap:8px}
.trow input,.trow select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.trow .full{grid-column:1/-1;display:flex;gap:8px}
.trow .full input{flex:1}
.trow small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.info{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin-bottom:6px}
.info dt{color:var(--muted)}.info dd{margin:0}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.meter span{display:block;height:100%;background:var(--leaf)}
.att{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.att:first-child{border-top:0}
.att .nm{flex:1;min-width:0}
.att .nm b{display:block;font-weight:600}
.att .nm span{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.att label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.mini{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:12.5px}
.mini:hover{color:var(--danger)}
.share{display:flex;gap:8px}
.share input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--muted)}
.banner{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}

/* ---- members portal ---- */
.app.portal{grid-template-columns:1fr;grid-template-rows:1fr}
.app.portal .side,.app.portal .topbar{display:none}
.p-head{background:var(--canopy);color:var(--canopy-ink)}
.p-inner{max-width:880px;margin:0 auto;padding:30px 24px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.p-inner h1{color:var(--canopy-ink)}
.p-inner p{color:var(--canopy-muted);margin:6px 0 0}
.p-inner a{color:var(--canopy-muted);font-size:13.5px}
.p-body{max-width:880px;margin:0 auto;padding:24px 24px 80px}
.pills{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.p-day{margin:0 0 24px}
.p-day h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em}
.p-day.today h3{color:var(--leaf)}
.p-card{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:8px;text-decoration:none;color:inherit}
.p-card:hover{border-color:var(--muted)}
.p-card .t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15}
.p-card .t small{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:12.5px}
.p-card h4{margin:0 0 2px;font-size:16px;font-weight:600}
.p-card .sub{color:var(--muted);font-size:14px}
.p-card .right{text-align:right;font-size:13.5px;white-space:nowrap}
.p-card.cancelled h4{text-decoration:line-through}
.p-card.cancelled{opacity:.65}
.tag-sm{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);margin:4px 6px 0 0}
.tag-sm.low{color:var(--clay)}.tag-sm.out{color:var(--danger)}
.ev-back{display:table;margin-bottom:18px;color:var(--muted);text-decoration:none;font-weight:500}
.ev-back:hover{color:var(--ink)}
.ev-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start;margin-top:22px}

  let ns = null;
  const hasClaude = window.claude && typeof window.claude.use === 'function';
  try { ns = hasClaude ? await window.claude.use('db') : null; } catch(e){ ns = null; }
  if (ns){
    db = ns; state.mode = 'shared';
    const onErr = e => { if (e && e.code === 'revoked') toast('Access to shared data ended.'); };
    const sub = coll => db.collection(coll).onSnapshot(s => { state[coll] = s.docs.map(d => ({...d.data(), id:d.id})); refresh(); }, onErr);
    ['team','divisions','offerings','registrations','tasks','finance','contacts','sequences'].forEach(sub);
    db.doc('settings/org').onSnapshot(s => { state.org = s.exists ? {...s.data()} : {}; refresh(); }, onErr);
    try { const u = await window.claude.use('user'); if (u){ state.canWrite = await u.can('data.write'); state.canEdit = await u.canEdit(); } else state.canEdit = false; } catch(e){ state.canEdit = false; }
    try { state.ai = await window.claude.use('sample'); } catch(e){ state.ai = null; }
    try { state.assets = await window.claude.use('assets'); } catch(e){ state.assets = null; }
  } else { state.mode = 'local'; state.canWrite = true; state.canEdit = true; state.ai = null; loadLocal(); }
  refresh();
}

/* ---------- Dates ---------- */
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const ds = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return ds(d); };
const dow = s => pd(s).getUTCDay();
function today(){
  try { return new Intl.DateTimeFormat('en-CA', {timeZone:state.org.timezone || 'America/Costa_Rica', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()); }
  catch(e){ return ds(new Date()); }
}
const fmtDate = (s, opt = {weekday:'short', month:'short', day:'numeric'}) => pd(s).toLocaleDateString('en-US', {...opt, timeZone:'UTC'});
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; const hh = ((h + 11) % 12) + 1; return m ? `${hh}:${String(m).padStart(2, '0')}${ap}` : `${hh}${ap}`; };
const timeRange = o => o.startTime ? fmtTime(o.startTime) + (o.endTime ? '–' + fmtTime(o.endTime) : '') : '';
const weekStart = s => addDays(s, -((dow(s) + 6) % 7));
const dayLabel = s => s === today() ? 'Today' : s === addDays(today(), 1) ? 'Tomorrow' : fmtDate(s, {weekday:'long', month:'long', day:'numeric'});

/* ---------- Events & classes logic ---------- */
function occurrences(o, from, to){
  const out = [];
  if (!o.startDate) return out;
  if (o.repeat !== 'weekly'){ if (o.startDate >= from && o.startDate <= to) out.push(o.startDate); return out; }
  const days = (o.days || []).map(Number); if (!days.length) return out;
  let d = o.startDate > from ? o.startDate : from;
  const end = o.endDate && o.endDate < to ? o.endDate : to;
  let guard = 0;
  while (d <= end && guard++ < 800){ if (days.includes(dow(d))) out.push(d); d = addDays(d, 1); }
  return out;
}
function sessions(from, to, {published = false, kind = ''} = {}){
  const list = [];
  for (const o of state.offerings){
    if (published && o.status !== 'published') continue;
    if (kind && o.kind !== kind) continue;
    for (const date of occurrences(o, from, to)) list.push({o, date, cancelled:(o.skipDates || []).includes(date)});
  }
  return list.sort((a, b) => (a.date + (a.o.startTime || '')).localeCompare(b.date + (b.o.startTime || '')));
}
const regsFor = (oid, date) => state.registrations.filter(r => r.offeringId === oid && r.sessionDate === date);
const spotsLeft = (o, date) => o.capacity ? Math.max(0, Number(o.capacity) - regsFor(o.id, date).length) : null;
const ticketLeft = (t, regs) => t.qty ? Math.max(0, Number(t.qty) - regs.filter(r => r.ticketId === t.id).length) : null;
const person = id => state.team.find(m => m.id === id);
function money(price, cur){
  const n = Number(price || 0); if (!n) return 'Free';
  return cur === 'USD' ? '$' + n.toLocaleString('en-US') : '₡' + n.toLocaleString('en-US');
}
function priceLabel(o){
  const t = o.tickets || [];
  if (!t.length) return o.access === 'members' ? 'Included for members' : 'Free';
  const min = t.reduce((a, b) => Number(b.price || 0) < Number(a.price || 0) ? b : a);
  if (memberIncluded(o)) return t.length === 1 ? `Members free, ${t[0].name.toLowerCase()} ${money(t[0].price, t[0].currency)}` : `Members free, others from ${money(min.price, min.currency)}`;
  return t.length > 1 && Number(min.price) ? 'From ' + money(min.price, min.currency) : money(min.price, min.currency);
}
function whenLabel(o){
  if (o.repeat === 'weekly'){
    const days = (o.days || []).map(Number).sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
    const d = days.length === 7 ? 'Every day' : days.length === 1 ? DOW_LONG[days[0]] : days.map(x => DOW[x]).join(', ');
    return `${d}, ${timeRange(o)}` + (o.endDate ? ` until ${fmtDate(o.endDate, {month:'short', day:'numeric'})}` : '');
  }
  return o.startDate ? `${fmtDate(o.startDate)}, ${timeRange(o)}` : '';
}
const memberIncluded = o => o.access === 'members' || o.kind === 'class';
const shareUrl = o => `${ARTIFACT_URL}#event/${o.id}`;
const kindName = k => k === 'event' ? 'Event' : 'Class';

/* ---------- Routing ---------- */
function routeFromHash(){
  const parts = (location.hash.slice(1) || 'dashboard').split('/');
  const page = parts[0];
  if (page === 'portal' || page === 'event' || page === 'contact'){ state.route = {page, tab:'', id:parts[1] || '', date:parts[2] || ''}; return; }
  const p = MODULES.some(m => m.key === page) ? page : 'dashboard';
  let tab = parts[1] || '';
  if (p === 'settings' && !['team','divisions','access','organization'].includes(tab)) tab = 'team';
  if (p === 'events' && !['schedule','all'].includes(tab)) tab = 'schedule';
  if (p === 'operations' && !['board','list'].includes(tab)) tab = 'board';
  if (p === 'crm' && !['stewards','members','contacts','pipelines','sequences','queue'].includes(tab)) tab = 'contacts';
  state.route = {page:p, tab, id:'', date:''};
}
window.addEventListener('hashchange', () => { routeFromHash(); closeDrawer(true); renderNav(); renderPage(); refresh(); closeSide(); $('#main').scrollTop = 0; });

/* Session panel (staff) */
function openSession(oid, date){
  const o = state.offerings.find(x => x.id === oid); if (!o) return;
  const body = `<div id="sessInfo"></div>
    <div class="subhead">Bookings</div>
    <div id="sessAtt"></div>
    <div class="subhead">Add someone</div>
    <div class="grid2">
      <div class="fld"><label for="a-name">Name</label><input id="a-name" name="name"><span class="err">Enter a name.</span></div>
      <div class="fld"><label for="a-email">Email</label><input id="a-email" name="email" type="email"><span class="err">Enter a valid email.</span></div>
    </div>
    ${(o.tickets || []).length ? `<div class="fld"><label for="a-t">Ticket</label><select id="a-t" name="ticketId">${memberIncluded(o) ? '<option value="">Member, included</option>' : ''}${o.tickets.map(t => `<option value="${esc(t.id)}">${esc(t.name)}, ${money(t.price, t.currency)}</option>`).join('')}</select></div>` : ''}
    <div class="subhead">Share</div>
    <div class="share"><input readonly value="${esc(shareUrl(o))}" id="shareIn" aria-label="Share link"><button type="button" class="btn" id="copyBtn">Copy link</button></div>`;
  const foot = `<button type="button" class="btn" id="editO">Edit</button><button type="button" class="btn" id="skipBtn"></button><span class="spacer"></span><button type="submit" class="btn primary">Add booking</button>`;
  openDrawer(o.title, body, foot, async fd => {
    const v = Object.fromEntries(fd.entries()); v.name = (v.name || '').trim(); v.email = (v.email || '').trim();
    const nOk = !!v.name, eOk = !v.email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email);
    $('#a-name').closest('.fld').classList.toggle('invalid', !nOk);
    $('#a-email').closest('.fld').classList.toggle('invalid', !eOk);
    if (!nOk || !eOk) return;
    const left = spotsLeft(o, date); if (left === 0){ toast('This session is full.'); return; }
    try {
      await upsert('registrations', null, {offeringId:o.id, sessionDate:date, name:v.name, email:v.email, ticketId:v.ticketId || '', paid:false, source:'staff'});
      $('#a-name').value = ''; $('#a-email').value = ''; toast(`${v.name} booked`);
    } catch(err){ toast(writeError(err)); }
  });
  state.openSession = {oid, date};
  $('#editO').addEventListener('click', () => { closeDrawer(true); openOffering(state.offerings.find(x => x.id === oid)); });
  $('#copyBtn').addEventListener('click', e => copyLink($('#shareIn'), e.target));
  $('#skipBtn').addEventListener('click', async () => {
    const cur = state.offerings.find(x => x.id === oid); const skip = new Set(cur.skipDates || []);
    const was = skip.has(date); was ? skip.delete(date) : skip.add(date);
    try { await upsert('offerings', oid, {...stripId(cur), skipDates:[...skip]}); toast(was ? 'Session restored' : 'Session cancelled'); } catch(err){ toast(writeError(err)); }
  });
  fillSessionPanel();
}
function fillSessionPanel(){
  const s = state.openSession; if (!s || !$('#sessInfo')) return;
  const o = state.offerings.find(x => x.id === s.oid); if (!o){ closeDrawer(); return; }
  const regs = regsFor(o.id, s.date), f = person(o.facilitatorId), cancelled = (o.skipDates || []).includes(s.date);
  const pct = o.capacity ? Math.min(100, Math.round(regs.length / o.capacity * 100)) : 0;
  $('#drawerTitle').textContent = o.title;
  $('#sessInfo').innerHTML = `${cancelled ? '<div class="banner">This session is cancelled. It shows as cancelled on the members portal.</div>' : ''}
    ${o.status !== 'published' ? '<div class="banner">Draft. Not visible on the members portal.</div>' : ''}
    <dl class="info">
      <dt>When</dt><dd>${esc(fmtDate(s.date, {weekday:'long', month:'long', day:'numeric'}))}, ${esc(timeRange(o))}</dd>
      <dt>Facilitator</dt><dd>${f ? esc(f.name) : '<span class="muted">Unassigned</span>'}</dd>
      <dt>Location</dt><dd>${esc(o.location || '—')}</dd>
      <dt>Who can book</dt><dd>${o.access === 'members' ? 'Members only' : 'Open to everyone'}</dd>
      <dt>Booked</dt><dd>${regs.length}${o.capacity ? ` of ${o.capacity}` : ''}</dd>
    </dl>
    ${o.capacity ? `<div class="meter" aria-hidden="true"><span style="width:${pct}%"></span></div>` : ''}
    ${(o.tickets || []).map(t => { const left = ticketLeft(t, regs); return `<div class="tk"><div><b>${esc(t.name)}</b><span>${money(t.price, t.currency)}</span></div><div>${regs.filter(r => r.ticketId === t.id).length} sold${left !== null ? `, ${left} left` : ''}</div></div>`; }).join('')}`;
  $('#skipBtn').textContent = cancelled ? 'Restore session' : 'Cancel session';
  const att = $('#sessAtt');
  if (!regs.length){ att.innerHTML = '<p class="muted" style="margin:0">No bookings yet.</p>'; return; }
  att.innerHTML = regs.map(r => { const t = (o.tickets || []).find(x => x.id === r.ticketId); return `<div class="att">
    <div class="nm"><b>${esc(r.name)}</b><span>${esc(r.email || 'No email')}${t ? ', ' + esc(t.name) : ''}${r.source === 'portal' ? ', booked online' : ''}</span></div>
    ${t && Number(t.price) ? `<label><input type="checkbox" data-paid="${esc(r.id)}" ${r.paid ? 'checked' : ''}>Paid</label>` : ''}
    <button type="button" class="mini" data-rm="${esc(r.id)}">Remove</button></div>`; }).join('');
  att.querySelectorAll('[data-paid]').forEach(c => c.addEventListener('change', async () => {
    const r = state.registrations.find(x => x.id === c.dataset.paid);
    try { await upsert('registrations', r.id, {...stripId(r), paid:c.checked}); } catch(err){ toast(writeError(err)); c.checked = !c.checked; }
  }));
  att.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', async () => {
    try { await removeDoc('registrations', b.dataset.rm); toast('Booking removed'); } catch(err){ toast(writeError(err)); }
  }));
}

function bindPortal(){
  document.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {

function sessionStatus(o, date, cancelled){
  if (cancelled) return '<span class="tag-sm out">Cancelled</span>';
  const left = spotsLeft(o, date);
  let s = '';
  if (o.access === 'members') s += '<span class="tag-sm">Members only</span>';
  if (left === 0) s += '<span class="tag-sm out">Full</span>';
  else if (left !== null && left <= 5) s += `<span class="tag-sm low">${left} ${left === 1 ? 'spot' : 'spots'} left</span>`;
  return s;
}
function fillPortal(){
  const box = $('#r-portal'); if (!box) return;

  const td = today(), list = sessions(td, addDays(td, 20), {published:true, kind:state.portalKind});

  box.innerHTML = dates.map(d => `<section class="p-day ${d === td ? 'today' : ''}"><h3>${esc(dayLabel(d))}</h3>

        <div><h4>${esc(s.o.title)}</h4><div class="sub">${[f ? 'with ' + esc(f.name) : '', s.o.location ? esc(s.o.location) : ''].filter(Boolean).join(', ') || esc(kindName(s.o.kind))}</div>${sessionStatus(s.o, d, s.cancelled)}</div>
        <div class="right">${esc(priceLabel(s.o))}</div>${cs ? `<img class="thumb" src="${esc(cs)}" alt="">` : ''}</a>`; }).join('')}
  </section>`).join('');
}

function openBooking(o, date){
  const regs = regsFor(o.id, date), tks = o.tickets || [];
  const firstOpen = memberIncluded(o) ? null : tks.find(t => ticketLeft(t, regs) !== 0);
  const body = `<p class="muted" style="margin-top:0">${esc(dayLabel(date))}, ${esc(timeRange(o))}${o.location ? ' at ' + esc(o.location) : ''}</p>
    ${state.canWrite === false ? '<div class="banner">Online booking isn’t available on this link. Reserve at the front desk or by WhatsApp.</div>' : ''}
    <div class="fld"><label for="b-name">Your name</label><input id="b-name" name="name" autocomplete="name"><span class="err">Enter your name.</span></div>
    <div class="fld"><label for="b-email">Email</label><input id="b-email" name="email" type="email" autocomplete="email"><span class="err">Enter a valid email.</span></div>
    ${tks.length ? `<div class="fld"><label id="b-t">Ticket</label><div class="tkpick" role="radiogroup" aria-labelledby="b-t">${memberIncluded(o) ? '<label><input type="radio" name="ticketId" value="" checked><b>I’m a member</b><span>Included</span></label>' : ''}${tks.map(t => { const left = ticketLeft(t, regs);
      return `<label class="${left === 0 ? 'off' : ''}"><input type="radio" name="ticketId" value="${esc(t.id)}" ${left === 0 ? 'disabled' : ''} ${firstOpen && firstOpen.id === t.id ? 'checked' : ''}><b>${esc(t.name)}</b><span>${money(t.price, t.currency)}${left === 0 ? ', sold out' : ''}</span></label>`; }).join('')}</div></div>` : ''}`;
  const foot = `<span class="spacer"></span><button type="button" class="btn ghost" onclick="closeDrawer()">Cancel</button><button type="submit" class="btn primary" ${state.canWrite === false ? 'disabled' : ''}>Confirm booking</button>`;
  openDrawer(`Book ${o.title}`, body, foot, async fd => {
    const v = Object.fromEntries(fd.entries()); v.name = (v.name || '').trim(); v.email = (v.email || '').trim().toLowerCase();
    const nOk = !!v.name, eOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email);
    $('#b-name').closest('.fld').classList.toggle('invalid', !nOk);
    $('#b-email').closest('.fld').classList.toggle('invalid', !eOk);
    if (!nOk || !eOk) return;
    const now = regsFor(o.id, date);
    if (spotsLeft(o, date) === 0){ toast('Sorry, this session just filled up.'); return; }
    if (now.some(r => (r.email || '').toLowerCase() === v.email)){ toast('You’re already booked for this session.'); return; }
    const t = tks.find(x => x.id === v.ticketId);
    if (tks.length && !t && !memberIncluded(o)){ toast('Choose a ticket.'); return; }
    if (t && ticketLeft(t, now) === 0){ toast('That ticket just sold out.'); return; }
    try {
      await upsert('registrations', null, {offeringId:o.id, sessionDate:date, name:v.name, email:v.email, ticketId:t ? t.id : '', paid:false, source:'portal'});
    } catch(err){ toast('Couldn’t book online. Reserve at the front desk or by WhatsApp.'); return; }
    const paid = t && Number(t.price);
    $('#drawerBody').innerHTML = `<div class="done-msg"><p class="muted">You’re booked</p><p class="big">${esc(o.title)}</p><p>${esc(dayLabel(date))}, ${esc(timeRange(o))}</p>
      ${paid ? (t.link ? `<p>Your ${esc(t.name)} ticket is ${money(t.price, t.currency)}.</p><a class="btn primary" href="${esc(t.link)}" target="_blank" rel="noopener">Pay ${money(t.price, t.currency)}</a>` : `<p class="muted">Pay ${money(t.price, t.currency)} at the front desk when you arrive.</p>`) : ''}</div>`;
    $('#drawerFoot').innerHTML = `<span class="spacer"></span><button type="button" class="btn" onclick="closeDrawer()">Done</button>`;
  });
}

let drawerSubmit = null, lastFocus = null;

  $('#drawerBody').scrollTop = 0;

}
function closeDrawer(silent){
  if (!$('#drawer').classList.contains('open')) return;
  $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true');

$('#drawerClose').addEventListener('click', () => closeDrawer());
$('#scrim').addEventListener('click', () => closeDrawer());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('#drawerForm').addEventListener('submit', e => { e.preventDefault(); drawerSubmit && drawerSubmit(new FormData(e.target)); });

function deleteButton(label, onConfirm){

  b.addEventListener('click', async () => {

    try { await onConfirm(); closeDrawer(); toast(label); } catch(err){ toast(writeError(err)); }
  });
}
function copyLink(input, btn){
  const done = () => { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = t, 1600); };
  const fallback = () => { input.focus(); input.select(); try { document.execCommand('copy') ? done() : toast('Press Ctrl+C or ⌘C to copy'); } catch(e){ toast('Press Ctrl+C or ⌘C to copy'); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done, fallback);
  else fallback();
}

/* ---------- Operations: tasks ---------- */
const STATUSES = [['backlog','Backlog'],['next','Next up'],['doing','In progress'],['review','Review'],['done','Done']];
const PRIORITIES = [['urgent','Urgent'],['high','High'],['medium','Medium'],['low','Low']];
const TASK_KINDS = [['task','Task'],['maintenance','Maintenance'],['purchase','Purchase'],['event','Event prep']];
const statusName = k => (STATUSES.find(s => s[0] === k) || STATUSES[0])[1];
const priName = k => (PRIORITIES.find(s => s[0] === k) || PRIORITIES[2])[1];
const priRank = k => PRIORITIES.findIndex(p => p[0] === (k || 'medium'));
function dueClass(d, status){
  if (!d || status === 'done') return '';
  const td = today(); if (d < td) return 'late'; if (d <= addDays(td, 2)) return 'soon'; return '';
}
function dueLabel(d){
  if (!d) return ''; const td = today();
  if (d === td) return 'Today'; if (d === addDays(td, 1)) return 'Tomorrow'; if (d < td) return fmtDate(d, {month:'short', day:'numeric'}) + ', overdue';
  return fmtDate(d, {month:'short', day:'numeric'});
}
const sortTasks = arr => [...arr].sort((a, b) => priRank(a.priority) - priRank(b.priority) || String(a.dueDate || '9').localeCompare(String(b.dueDate || '9')) || String(a.createdAt).localeCompare(String(b.createdAt)));

function pageOps(){
  const t = state.route.tab;
  const opts = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(([k, l]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${l}</option>`).join('');
  return `<div class="page">
    <div class="page-head">
      <div><h1>Operations</h1><p class="lede">Everything the team needs to get done: tasks, maintenance, purchases, and event prep, moving through one pipeline.</p></div>
      <div class="head-actions"><button class="btn primary" type="button" id="newTask">New task</button></div>
    </div>
    <nav class="tabs" aria-label="Operations sections">
      <a href="#operations/board" ${t === 'board' ? 'aria-current="page"' : ''}>Pipeline</a>
      <a href="#operations/list" ${t === 'list' ? 'aria-current="page"' : ''}>List</a>
    </nav>
    <div class="toolbar">
      <select class="field-in" id="tAsg" aria-label="Filter by assignee"></select>
      <select class="field-in" id="tDiv" aria-label="Filter by division"></select>
      <select class="field-in" id="tPri" aria-label="Filter by priority">${opts(PRIORITIES, state.ops.pri, 'Any priority')}</select>
      <select class="field-in" id="tKind" aria-label="Filter by type">${opts(TASK_KINDS, state.ops.kind, 'All types')}</select>
      ${t === 'list' ? `<select class="field-in" id="tStatus" aria-label="Filter by status"><option value="open" ${state.ops.status === 'open' ? 'selected' : ''}>Open</option>${STATUSES.map(([k, l]) => `<option value="${k}" ${state.ops.status === k ? 'selected' : ''}>${l}</option>`).join('')}<option value="" ${state.ops.status === '' ? 'selected' : ''}>Everything</option></select>` : ''}
    </div>
    <div id="r-tasks"></div>
  </div>`;
}
function bindOps(){
  $('#newTask').addEventListener('click', () => openTask());
  const on = (id, key) => { const el = $(id); if (el) el.addEventListener('change', e => { state.ops[key] = e.target.value; fillTasks(); }); };
  on('#tAsg', 'asg'); on('#tDiv', 'div'); on('#tPri', 'pri'); on('#tKind', 'kind'); on('#tStatus', 'status');
}
function filteredTasks(){
  const f = state.ops;
  return state.tasks.filter(t => (!f.asg || (f.asg === 'none' ? !t.assigneeId : t.assigneeId === f.asg)) && (!f.div || t.divisionId === f.div) && (!f.pri || (t.priority || 'medium') === f.pri) && (!f.kind || (t.kind || 'task') === f.kind));
}
function fillTasks(){
  const box = $('#r-tasks'); if (!box) return;
  const asg = $('#tAsg'), dv = $('#tDiv');
  if (asg){ asg.innerHTML = `<option value="">Anyone</option><option value="none">Unassigned</option>` + sortByName(state.team.filter(m => m.status !== 'inactive')).map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join(''); asg.value = state.ops.asg; if (asg.value !== state.ops.asg) asg.value = ''; }
  if (dv){ dv.innerHTML = `<option value="">All divisions</option>` + sortByName(state.divisions).map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join(''); dv.value = state.ops.div; if (dv.value !== state.ops.div) dv.value = ''; }
  if (state.mode === 'loading'){ box.innerHTML = '<div class="empty"><p>Loading tasks…</p></div>'; return; }
  if (!state.tasks.length){
    box.innerHTML = `<div class="empty"><h2>No tasks yet</h2><p>Add the first thing that needs doing, assign it to someone, and move it across the pipeline as it progresses.</p><button class="btn primary" type="button" id="emptyTask">New task</button></div>`;
    $('#emptyTask').addEventListener('click', () => openTask()); return;
  }
  const tasks = filteredTasks();
  if (state.route.tab === 'list') return fillTaskList(box, tasks);
  box.innerHTML = `<div class="board">${STATUSES.map(([k, l]) => {
    let list = sortTasks(tasks.filter(t => (t.status || 'backlog') === k));
    const total = list.length, collapsed = k === 'done' && !state.ops.showDone && list.length > 5;
    if (collapsed) list = list.slice(0, 5);
    return `<section class="col" data-status="${k}"><header>${l}<span>${total}</span></header>
      ${list.map(taskCard).join('')}
      ${collapsed ? `<button type="button" class="more" id="showDone">Show all ${total}</button>` : ''}
      ${!total ? '<p class="muted" style="font-size:12.5px;margin:0;padding:4px 6px">Nothing here</p>' : ''}
    </section>`; }).join('')}</div>`;
  const sd = $('#showDone'); if (sd) sd.addEventListener('click', () => { state.ops.showDone = true; fillTasks(); });
  bindTaskCards(box);
  box.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain'); const t = state.tasks.find(x => x.id === id);
      if (t && (t.status || 'backlog') !== col.dataset.status) await setTaskStatus(t, col.dataset.status);
    });
  });
}
function taskCard(t){
  const a = person(t.assigneeId), d = divById(t.divisionId), dc = dueClass(t.dueDate, t.status);
  return `<button type="button" class="task" draggable="true" data-id="${esc(t.id)}">
    ${(t.kind && t.kind !== 'task') || d ? `<span class="tkind">${[t.kind && t.kind !== 'task' ? TASK_KINDS.find(x => x[0] === t.kind)[1] : '', d ? esc(d.name) : ''].filter(Boolean).join(', ')}</span>` : ''}
    <b>${esc(t.title)}</b>
    <span class="tmeta"><span class="pri ${t.priority || 'medium'}"><i></i>${priName(t.priority)}</span>${t.dueDate ? `<span class="due ${dc}">${esc(dueLabel(t.dueDate))}</span>` : ''}
    ${a ? `<span class="av" style="background:${d ? colorVar(d.color) : 'var(--slate)'}" title="${esc(a.name)}">${esc(initials(a.name))}</span>` : ''}</span>
  </button>`;
}
function bindTaskCards(box){
  box.querySelectorAll('.task[data-id]').forEach(c => {
    c.addEventListener('click', () => openTask(state.tasks.find(t => t.id === c.dataset.id)));
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
}
function fillTaskList(box, tasks){
  const s = state.ops.status;
  let list = tasks.filter(t => s === '' ? true : s === 'open' ? (t.status || 'backlog') !== 'done' : (t.status || 'backlog') === s);
  list = sortTasks(list);

/* ---------- Finance ---------- */
const REV_LINES = [['membership','Memberships'],['events','Events & classes'],['shop','Farm shop'],['fnb','Food & beverage'],['land','Land sales'],['other','Other']];
const monthKey = s => s.slice(0, 7);
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-US', {month:'long', year:'numeric', timeZone:'UTC'}); };
const shortMonth = k => { const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-US', {month:'short', timeZone:'UTC'}); };
const addMonths = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const finDoc = k => state.finance.find(f => f.id === k) || {};
const revTotal = f => REV_LINES.reduce((n, [k]) => n + Number(f[k] || 0), 0);
const fmtMoney = n => { const cur = state.org.currency || 'CRC'; const v = Math.round(Number(n || 0)); const s = Math.abs(v).toLocaleString('en-US'); return (v < 0 ? '−' : '') + (cur === 'USD' ? '$' : '₡') + s; };
function ticketSalesForMonth(k){
  let n = 0;
  for (const r of state.registrations){ if (!r.paid || monthKey(r.sessionDate || '') !== k) continue;
    const o = state.offerings.find(x => x.id === r.offeringId); const t = o && (o.tickets || []).find(x => x.id === r.ticketId);
    if (t && (t.currency || 'CRC') === (state.org.currency || 'CRC')) n += Number(t.price || 0); }
  return n;
}
function pageFinance(){
  return `<div class="page">
    <div class="page-head"><div><h1>Finance</h1><p class="lede">Monthly revenue, expenses, receivables, payables, and cash, for the people who need to see it.</p></div>
      <div class="head-actions" id="finActions"></div></div>
    <div id="r-fin"></div></div>`;
}
function fillFinance(){
  const box = $('#r-fin'); if (!box) return;
  if (state.mode === 'loading' || state.canEdit === null){ box.innerHTML = '<div class="empty"><p>Checking access…</p></div>'; return; }
  if (!state.canEdit){
    $('#finActions').innerHTML = '';
    box.innerHTML = `<div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><h2>Finance is restricted</h2><p>Only editors of this ARK OS page can see financial figures. Ask an admin to give you edit access if you need it.</p></div>`;
    return;
  }
  const k = state.fin.month || monthKey(today()), f = finDoc(k);
  $('#finActions').innerHTML = `<button class="btn primary" type="button" id="editMonth">${f.updatedAt ? 'Edit ' + shortMonth(k) : 'Enter ' + shortMonth(k) + ' figures'}</button>`;
  $('#editMonth').addEventListener('click', () => openMonth(k));
  const rev = revTotal(f), exp = Number(f.expenses || 0), net = rev - exp, tix = ticketSalesForMonth(k);
  const months = Array.from({length:6}, (_, i) => addMonths(k, i - 5));
  const series = months.map(m => { const d = finDoc(m); return {m, rev:revTotal(d), exp:Number(d.expenses || 0), has:!!d.updatedAt}; });
  const max = Math.max(1, ...series.flatMap(s => [s.rev, s.exp]));
  const W = 520, H = 180, pad = 24, bw = (W - pad * 2) / 6;
  const bars = series.map((s, i) => { const x = pad + i * bw; const h1 = (s.rev / max) * (H - 40), h2 = (s.exp / max) * (H - 40);
    return `<rect x="${x + 8}" y="${H - 24 - h1}" width="${bw / 2 - 10}" height="${h1}" rx="3" fill="var(--leaf)"/><rect x="${x + bw / 2 + 2}" y="${H - 24 - h2}" width="${bw / 2 - 10}" height="${h2}" rx="3" fill="var(--clay)" opacity=".85"/><text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="inherit">${shortMonth(s.m)}</text>`; }).join('');
  const kpi = (label, val, cls = '', small = '') => `<div class="kpi ${cls}"><span>${label}</span><b>${fmtMoney(val)}</b>${small ? `<small>${small}</small>` : ''}</div>`;
  const all = [...state.finance].filter(x => x.updatedAt).sort((a, b) => b.id.localeCompare(a.id));
  box.innerHTML = `
    <div class="monthnav"><span class="range">${monthLabel(k)}</span><button class="btn" type="button" id="mPrev">Previous</button><button class="btn" type="button" id="mNow">This month</button><button class="btn" type="button" id="mNext">Next</button></div>
    ${f.updatedAt ? '' : `<div class="banner">No figures entered for ${monthLabel(k)} yet. Use the button above to add them.</div>`}
    <div class="kpis">
      ${kpi('Revenue', rev, '', tix ? `${fmtMoney(tix)} in ticket sales marked paid in ARK OS` : '')}
      ${kpi('Expenses', exp)}
      ${kpi('Net', net, net < 0 ? 'neg' : net > 0 ? 'pos' : '')}
      ${kpi('Cash in bank', f.cash, '', f.cashDate ? 'as of ' + fmtDate(f.cashDate) : '')}
      ${kpi('Accounts receivable', f.ar, '', 'owed to The ARK')}
      ${kpi('Accounts payable', f.ap, '', 'The ARK owes')}
    </div>
    <div class="fin-grid">
      <div class="chart"><h2>Last six months</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses by month">${bars}</svg><div class="lg"><span><i style="background:var(--leaf)"></i>Revenue</span><span><i style="background:var(--clay)"></i>Expenses</span></div></div>
      <div class="brk"><h2>Revenue by line</h2>${REV_LINES.map(([key, l]) => `<div class="ln"><span>${l}</span><span>${fmtMoney(f[key])}</span></div>`).join('')}<div class="ln"><span><b>Total</b></span><span><b>${fmtMoney(rev)}</b></span></div></div>
    </div>
    ${f.notes ? `<p class="note" style="margin-bottom:22px"><b>Notes:</b> ${esc(f.notes)}</p>` : ''}
    <h2 class="section-title">All months</h2>
    ${all.length ? `<div class="list"><div class="row head frow"><span>Month</span><span>Revenue</span><span>Expenses</span><span class="c-ar">Receivable</span><span class="c-ap">Payable</span><span class="c-cash">Cash</span></div>
      ${all.map(d => `<button type="button" class="row frow" data-m="${esc(d.id)}"><span><b>${monthLabel(d.id)}</b></span><span>${fmtMoney(revTotal(d))}</span><span>${fmtMoney(d.expenses)}</span><span class="c-ar">${fmtMoney(d.ar)}</span><span class="c-ap">${fmtMoney(d.ap)}</span><span class="c-cash">${fmtMoney(d.cash)}</span></button>`).join('')}</div>`
    : '<div class="empty"><p>No months recorded yet.</p></div>'}`;
  $('#mPrev').addEventListener('click', () => { state.fin.month = addMonths(k, -1); fillFinance(); });
  $('#mNext').addEventListener('click', () => { state.fin.month = addMonths(k, 1); fillFinance(); });
  $('#mNow').addEventListener('click', () => { state.fin.month = monthKey(today()); fillFinance(); });
  box.querySelectorAll('[data-m]').forEach(r => r.addEventListener('click', () => { state.fin.month = r.dataset.m; fillFinance(); $('#main').scrollTop = 0; }));
}
function openMonth(k){
  const f = finDoc(k), cur = state.org.currency === 'USD' ? '$' : '₡';
  const num = (name, label, val, hint = '') => `<div class="fld"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="number" min="0" step="any" value="${esc(val ?? '')}" placeholder="${cur} 0">${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;

    <div class="grid2">${REV_LINES.map(([key, l]) => num(key, l, f[key])).join('')}</div>

    <div class="grid2">${num('ar', 'Accounts receivable', f.ar, 'Invoices owed to The ARK')}${num('ap', 'Accounts payable', f.ap, 'Bills The ARK still owes')}</div>
    <div class="fld"><label for="f-cashDate">Cash balance as of</label><input id="f-cashDate" name="cashDate" type="date" value="${esc(f.cashDate)}"></div>
    <div class="fld"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" placeholder="One-offs, context, anything the next person should know">${esc(f.notes)}</textarea></div>`;
  const foot = `<span class="spacer"></span><button type="button" class="btn ghost" onclick="closeDrawer()">Cancel</button><button type="submit" class="btn primary">Save ${monthLabel(k)}</button>`;
  openDrawer(`${f.updatedAt ? 'Edit' : 'Enter'} ${monthLabel(k)}`, body, foot, async fd => {
    const v = Object.fromEntries(fd.entries()); const rec = {notes:v.notes.trim(), cashDate:v.cashDate};
    for (const key of [...REV_LINES.map(x => x[0]), 'expenses', 'cash', 'ar', 'ap']) rec[key] = v[key] === '' ? null : Number(v[key]);
    if (f.createdAt) rec.createdAt = f.createdAt;
    try { await upsert('finance', k, rec); closeDrawer(); toast(`${monthLabel(k)} saved`); } catch(err){ toast(writeError(err)); }
  });
}

function stepDue(e, seq, i){ let d = e.startedAt; for (let k = 0; k <= i; k++) d = addDays(d, Number((seq.steps[k] || {}).delayDays || 0)); return d; }
function enrollmentView(c, e){

  const sentCount = Object.keys(e.sent || {}).length, next = (seq.steps || []).findIndex((_, i) => !(e.sent || {})[i]);
  let line = e.status === 'stopped' ? 'Stopped' : next === -1 ? 'Completed' : `Step ${next + 1} of ${seq.steps.length} due ${dayLabel(stepDue(e, seq, next)).toLowerCase()}`;
  return `<div class="enr"><b>${esc(seq.name)}</b><span>${sentCount} of ${seq.steps.length} sent. ${line}.</span>
    <div class="acts">${e.status === 'active' && next >= 0 ? `<button type="button" class="btn" data-enr="${e.id}" data-enr-act="open" data-step="${next}">Open step ${next + 1}</button><button type="button" class="btn" data-enr="${e.id}" data-enr-act="stop">Stop</button>` : `<button type="button" class="btn" data-enr="${e.id}" data-enr-act="remove">Remove</button>`}</div></div>`;
}
async function enrollmentAction(c, eid, act, step){
  const list = c.enrollments || [], e = list.find(x => x.id === eid); if (!e) return;

  if (act === 'stop'){ await patchContact(c, {enrollments:list.map(x => x.id === eid ? {...x, status:'stopped'} : x)}); return; }
  if (act === 'open') openMessage(c, e, step);
}
function openMessage(c, e, i){

function stepEditor(st = {}, i = 0){

      <select name="s_channel" aria-label="Channel">${CHANNELS.map(([k, l]) => `<option value="${k}" ${(st.channel || 'email') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <div style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input name="s_delay" type="number" min="0" value="${esc(st.delayDays ?? (i === 0 ? 0 : 3))}" style="width:64px;margin:0" aria-label="Days after previous step"><span class="lbl">days ${i === 0 ? 'after enrolling' : 'later'}</span><button type="button" class="mini rmS">Remove</button></div></div>
    <input name="s_subject" placeholder="Subject (email only)" value="${esc(st.subject || '')}" style="margin-top:0">

function readSteps(form){
  const fd = new FormData(form), ch = fd.getAll('s_channel'), dl = fd.getAll('s_delay'), sj = fd.getAll('s_subject'), bd = fd.getAll('s_body');
  return ch.map((c, i) => ({channel:c, delayDays:Number(dl[i] || 0), subject:sj[i].trim(), body:bd[i].trim()}));
}
function openSequence(s){
  const edit = !!s; s = s || {steps:[{channel:'email', delayDays:0}]};
  const body = `
    <div class="fld"><label for="s-name">Sequence name</label><input id="s-name" name="name" value="${esc(s.name)}" placeholder="e.g. Waitlist welcome"><span class="err">Enter a name.</span></div>

    <div class="ai-box" id="aiBox"><label for="aiPrompt">Draft or change it with AI</label>
      <textarea id="aiPrompt" placeholder="Describe the sequence, or what to change. E.g. “3 steps over 10 days for waitlist signups: warm welcome email, WhatsApp nudge to apply, final email with a founding-rate reminder. Warm, short, no hype.”"></textarea>
      <div class="row-b"><button type="button" class="btn" id="aiGo">Generate steps</button><small id="aiNote">Replaces the steps below with the AI draft. Your name and description are kept.</small></div></div>
    <p class="merge">Merge fields: <code>{{first_name}}</code> <code>{{name}}</code> <code>{{org}}</code></p>
    <div id="steps">${(s.steps || []).map(stepEditor).join('')}</div>
    <button type="button" class="btn" id="addStep">Add step</button>`;
  const foot = `${edit ? '<button type="button" class="btn danger" id="delBtn">Delete</button>' : ''}<span class="spacer"></span><button type="button" class="btn ghost" onclick="closeDrawer()">Cancel</button><button type="submit" class="btn primary">${edit ? 'Save sequence' : 'Create sequence'}</button>`;
  openDrawer(edit ? 'Edit sequence' : 'New sequence', body, foot, async fd => {
    const name = fd.get('name').trim(), description = fd.get('description').trim();
    $('#s-name').closest('.fld').classList.toggle('invalid', !name); if (!name) return;
    const steps = readSteps($('#drawerForm')).filter(st => st.body);
    if (!steps.length){ toast('Add at least one step with a message.'); return; }
    const rec = {name, description, steps}; if (edit && s.createdAt) rec.createdAt = s.createdAt;
    try { await upsert('sequences', edit ? s.id : null, rec); closeDrawer(); toast(edit ? 'Sequence saved' : 'Sequence created'); } catch(err){ toast(writeError(err)); }
  });
  const sb = $('#steps');
  const renumber = () => { sb.querySelectorAll('.step-ed').forEach((el, i) => { el.querySelector('.lbl').textContent = `Step ${i + 1}`; el.querySelectorAll('.lbl')[1].textContent = `days ${i === 0 ? 'after enrolling' : 'later'}`; }); sb.querySelectorAll('.rmS').forEach(b => b.onclick = () => { b.closest('.step-ed').remove(); renumber(); }); };
  renumber();
  $('#addStep').addEventListener('click', () => { sb.insertAdjacentHTML('beforeend', stepEditor({channel:'email', delayDays:3}, sb.children.length)); renumber(); });
  $('#aiGo').addEventListener('click', () => aiDraftSequence(sb, renumber));
  if (state.ai === null){ $('#aiGo').disabled = true; $('#aiNote').textContent = 'AI drafting works on the published page when you’re signed in.'; }
  if (edit) deleteButton('Sequence deleted', () => removeDoc('sequences', s.id));
}
async function aiDraftSequence(sb, renumber){
  const prompt = $('#aiPrompt').value.trim(); if (!prompt){ toast('Describe what you want first.'); return; }
  const btn = $('#aiGo'), note = $('#aiNote'); btn.disabled = true; note.textContent = 'Drafting…';
  const existing = readSteps($('#drawerForm')).filter(st => st.body);
  const ctx = `You write short, warm, specific outreach for ${state.org.name || 'The ARK'}, a members club and regenerative community in ${state.org.location || 'Santa Teresa, Costa Rica'} with cowork, spa deck, classes, a farm, and land for sale. Membership is by invitation: never salesy, never hype, plain language, no exclamation marks, no emojis. Always use the merge field {{first_name}} for the person's first name and {{org}} for the organization. WhatsApp steps are 1–3 short sentences. Emails have a subject and 3–6 sentences.
Return ONLY a JSON object, no prose, no code fences: {"name": string, "description": string, "steps": [{"channel": "email"|"whatsapp", "delayDays": number, "subject": string, "body": string}]}. delayDays is days after the previous step (0 for the first). 2 to 6 steps.
${existing.length ? 'Current steps to revise: ' + JSON.stringify(existing) : ''}
Request: ${prompt}`;
  try {
    const out = await state.ai.json(ctx, {modelTier:'default', cache:false});
    const steps = Array.isArray(out.steps) ? out.steps.filter(st => st && st.body) : [];
    if (!steps.length) throw new Error('empty');
    sb.innerHTML = steps.map((st, i) => stepEditor({channel:st.channel === 'whatsapp' ? 'whatsapp' : 'email', delayDays:Number(st.delayDays || 0), subject:st.subject || '', body:st.body}, i)).join('');
    renumber();
    if (!$('#s-name').value && out.name) $('#s-name').value = out.name;
    if (!$('#s-desc').value && out.description) $('#s-desc').value = out.description;
    note.textContent = `${steps.length} steps drafted. Edit anything, then save.`;
  } catch(err){
    note.textContent = err && err.code === 'not_granted' ? 'AI drafting wasn’t allowed for this page.' : err && err.code === 'rate_limited' ? 'Too many requests. Try again in a minute.' : 'Couldn’t draft that. Try rephrasing.';
  }
  btn.disabled = false;
}

/* Send queue */
function queueItems(){
  const items = [], td = today();
  for (const c of state.contacts) for (const e of (c.enrollments || [])){
    if (e.status !== 'active') continue; const seq = state.sequences.find(s => s.id === e.sequenceId); if (!seq) continue;
    const i = (seq.steps || []).findIndex((_, k) => !(e.sent || {})[k]); if (i === -1) continue;
    const due = stepDue(e, seq, i); if (due <= td) items.push({c, e, seq, i, due});
  }
  return items.sort((a, b) => a.due.localeCompare(b.due));
}
function fillQueue(){
  const box = $('#r-queue'); if (!box) return;
  if (state.mode === 'loading'){ box.innerHTML = '<div class="empty"><p>Loading…</p></div>'; return; }
  const items = queueItems();
  if (!items.length){ box.innerHTML = '<div class="empty"><h2>Nothing due</h2><p>Messages appear here on the day they’re due, based on who’s enrolled in which sequence.</p></div>'; return; }
  box.innerHTML = `<div class="list"><div class="row head qrow"><span>Person</span><span>Message</span><span>Due</span><span></span></div>
    ${items.map((it, n) => `<div class="row qrow" style="cursor:default"><span class="who"><span class="av" style="background:${tierColor(it.c.tier)}">${esc(initials(it.c.name))}</span><span><b><a href="#contact/${esc(it.c.id)}" style="color:inherit;text-decoration:none">${esc(it.c.name)}</a></b><span>${it.seq.steps[it.i].channel === 'whatsapp' ? 'WhatsApp' : 'Email'}</span></span></span>
      <span><b style="font-weight:600">${esc(it.seq.name)}</b><br><span class="muted" style="font-size:13px">Step ${it.i + 1} of ${it.seq.steps.length}</span></span>
      <span class="due ${it.due < today() ? 'late' : ''}">${esc(dayLabel(it.due))}</span>
      <span class="acts"><button type="button" class="btn primary" data-q="${n}">Open</button></span></div>`).join('')}</div>`;
  box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { const it = items[Number(b.dataset.q)]; openMessage(it.c, it.e, it.i); }));
}

/* ---------- Members directory ---------- */
function pageMembers(){
  return `<div class="page"><div class="page-head"><div><h1>Members</h1><p class="lede">Everyone with an active membership. Open a card to see their full profile in the CRM.</p></div>
    <div class="head-actions"><a class="btn" href="#crm/members">Manage in CRM</a></div></div>
    <div class="stats" id="r-mstats" style="margin-bottom:22px"></div>
    <div class="toolbar"><input class="field-in search" id="mq" type="search" placeholder="Search members or interests" aria-label="Search members" value="${esc(state.crm.mq)}">
      <select class="field-in" id="mtier" aria-label="Filter by tier"><option value="">All tiers</option>${TIERS.slice(1).map(([k, l]) => `<option value="${k}" ${state.crm.mtier === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div id="r-dir"></div></div>`;
}
function bindMembers(){
  $('#mq').addEventListener('input', e => { state.crm.mq = e.target.value; fillMembers(); });
  $('#mtier').addEventListener('change', e => { state.crm.mtier = e.target.value; fillMembers(); });
}
function fillMembers(){
  const box = $('#r-dir'); if (!box) return;
  const members = state.contacts.filter(isActiveMember);
  const founding = members.filter(c => c.tier === 'founding').length;
  $('#r-mstats').innerHTML = [[members.length, 'Active members'], [Math.max(0, 200 - members.length), 'Spots left of 200'], [founding, 'Founding members'], [Math.max(0, 50 - founding), 'Founding spots left']].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  if (state.mode === 'loading'){ box.innerHTML = '<div class="empty"><p>Loading…</p></div>'; return; }
  const q = state.crm.mq.trim().toLowerCase();
  const list = sortByName(members.filter(c => (!state.crm.mtier || c.tier === state.crm.mtier) && (!q || [c.name, c.location, ...(c.interests || [])].some(v => String(v || '').toLowerCase().includes(q)))));
  if (!members.length){ box.innerHTML = `<div class="empty"><h2>No active members yet</h2><p>Members appear here once someone in the CRM has a tier and an active status.</p><a class="btn primary" href="#crm/members">Open the CRM</a></div>`; return; }
  if (!list.length){ box.innerHTML = '<div class="empty"><p>No members match that.</p></div>'; return; }
  box.innerHTML = `<div class="dir">${list.map(c => `<a class="mcard" href="#contact/${esc(c.id)}"><span class="av" style="background:${tierColor(c.tier)}">${esc(initials(c.name))}</span><h3>${esc(c.name)}</h3><span class="tier ${tierClass(c.tier)}">${tierName(c.tier)}</span><div class="sub">${esc((c.interests || []).slice(0, 3).join(', ') || c.location || '')}</div></a>`).join('')}</div>`;
}

/* ---------- Cover photos ---------- */
let pendingCover;
function coverSrc(o){ return o && o.cover ? (o.cover.data || (o.cover.id ? '/_blob/' + o.cover.id : '')) : ''; }
function coverEditor(o){
  const src = coverSrc(o);
  return `<div class="subhead">Cover photo</div><div class="cover-ed">${src ? `<img id="covPrev" src="${esc(src)}" alt="">` : '<div class="ph" id="covPrev">No photo</div>'}
    <div style="display:grid;gap:6px"><input type="file" id="covIn" accept="image/*" hidden><button type="button" class="btn" id="covPick">${src ? 'Replace photo' : 'Add photo'}</button>${src ? '<button type="button" class="btn ghost" id="covRm">Remove</button>' : ''}<span class="hint" id="covNote">Shown on the portal and the event page.</span></div></div>`;
}
function bindCover(o){
  pendingCover = o && o.cover ? {...o.cover} : null;
  const pick = $('#covPick'), inp = $('#covIn'), rm = $('#covRm');
  pick.addEventListener('click', () => inp.click());
  if (rm) rm.addEventListener('click', () => { pendingCover = {remove:true}; $('#covPrev').outerHTML = '<div class="ph" id="covPrev">No photo</div>'; rm.remove(); });
  inp.addEventListener('change', async () => {
    const file = inp.files[0]; if (!file) return;
    $('#covNote').textContent = 'Preparing photo…';
    try {
      const useAssets = state.mode === 'shared' && state.assets;
      const blob = await resizeImage(file, useAssets ? 1600 : 900, useAssets ? 0.85 : 0.72);
      if (!useAssets && blob.size > 170000) throw new Error('big');
      let cover;
      if (useAssets){ const r = await state.assets.upload(blob); cover = {id:r.id}; }
      else cover = {data:await blobToDataURL(blob)};
      pendingCover = cover;
      const url = cover.data || URL.createObjectURL(blob);
      $('#covPrev').outerHTML = `<img id="covPrev" src="${url}" alt="">`;
      $('#covNote').textContent = 'Photo ready. Save to keep it.';
    } catch(err){ $('#covNote').textContent = err.message === 'big' ? 'That photo is too large for this page. Try a smaller or simpler image.' : 'Couldn’t upload that photo.'; }
  });
}
function resizeImage(file, maxW, q){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const sc = Math.min(1, maxW / img.width); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q); URL.revokeObjectURL(img.src); }; img.onerror = () => rej(new Error('decode')); img.src = URL.createObjectURL(file); });
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

init();
</script>
